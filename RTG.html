<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Road Trip Adventures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['"Fredoka One"', 'cursive'],
                        'body': ['"Nunito"', 'sans-serif'],
                    },
                    colors: {
                        'brand-blue': '#4CA1AF',
                        'brand-green': '#28B463',
                        'brand-yellow': '#F1C40F',
                        'brand-red': '#E74C3C',
                        'road-gray': '#555555',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
            background-color: #2c3e50;
            user-select: none; /* Prevent text selection while tapping rapidly */
            -webkit-user-select: none;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: #87CEEB; /* Sky blue background for the very top */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* The scrolling road environment */
        .scrolling-environment {
            flex: 1;
            position: relative;
            background-color: #7CFC00; /* Grass color */
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .road {
            width: 70%;
            height: 100%;
            background-color: #555;
            position: relative;
            border-left: 10px solid #a8e6cf; /* shoulder */
            border-right: 10px solid #a8e6cf;
        }

        /* Scrolling dashed lines for lanes */
        .lane-lines {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            background-image: 
                linear-gradient(to bottom, transparent 50%, #fff 50%),
                linear-gradient(to bottom, transparent 50%, #fff 50%);
            background-size: 10px 100px; /* Width and height of the dash segments */
            background-position: 33% 0, 66% 0;
            background-repeat: repeat-y;
            opacity: 0.6;
        }

        /* Entities on the road */
        .car-entity {
            position: absolute;
            width: 33.33%; /* 1/3 of the road width */
            text-align: center;
            font-size: 4.5rem;
            filter: drop-shadow(0px 10px 5px rgba(0,0,0,0.4));
            transition: left 0.15s ease-out; /* Smooth lane switching */
            z-index: 10;
        }

        .obstacle-car {
            position: absolute;
            width: 33.33%;
            text-align: center;
            font-size: 4rem;
            z-index: 5;
        }

        /* UI Overlays */
        .speed-sign {
            background-color: white;
            border: 4px solid black;
            border-radius: 8px;
            padding: 4px 8px;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            color: black;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Police Lights Animation */
        @keyframes policeFlash {
            0% { box-shadow: inset 0 0 50px 20px rgba(255, 0, 0, 0.7); }
            50% { box-shadow: inset 0 0 50px 20px rgba(0, 0, 255, 0.7); }
            100% { box-shadow: inset 0 0 50px 20px rgba(255, 0, 0, 0.7); }
        }
        .police-active {
            animation: policeFlash 0.5s infinite;
        }

        /* Custom Modal Popup */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Control Buttons */
        .control-btn {
            touch-action: manipulation; /* Optimizes touch responsiveness */
        }
        .gas-pedal {
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            box-shadow: 0 8px 0 #1e8449, inset 0 2px 5px rgba(255,255,255,0.4);
            transform-origin: bottom;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .gas-pedal.active-press {
            transform: translateY(6px) scale(0.98);
            box-shadow: 0 2px 0 #1e8449, inset 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="font-body text-gray-800 antialiased">

    <div class="game-container" id="game-screen">
        
        <!-- TOP DASHBOARD: Resources -->
        <header class="bg-white p-3 shadow-md z-20 flex flex-col gap-2 rounded-b-2xl relative">
            <div class="flex justify-between items-center">
                <div class="bg-brand-blue text-white px-3 py-1 rounded-full font-display text-sm md:text-lg shadow-sm">
                    <i class="fa-solid fa-map-location-dot mr-1"></i> Level 1
                </div>
                <div class="bg-brand-yellow text-gray-800 px-3 py-1 rounded-full font-display text-sm md:text-lg shadow-sm">
                    <i class="fa-solid fa-coins text-yellow-600 mr-1"></i> <span id="coin-counter">150</span>
                </div>
            </div>

            <!-- Meters -->
            <div class="flex gap-4 items-center mt-1">
                <div class="flex-1 flex flex-col gap-1">
                    <div class="flex justify-between text-[10px] md:text-xs font-bold text-gray-600 uppercase">
                        <span><i class="fa-solid fa-gas-pump text-brand-red mr-1"></i> Gas</span>
                        <span id="gas-text">100%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 md:h-4 shadow-inner border border-gray-300">
                        <div id="gas-fill" class="bg-brand-red h-full rounded-full transition-all" style="width: 100%"></div>
                    </div>
                </div>
                <div class="flex-1 flex flex-col gap-1">
                    <div class="flex justify-between text-[10px] md:text-xs font-bold text-gray-600 uppercase">
                        <span><i class="fa-solid fa-cookie-bite text-brand-green mr-1"></i> Snacks</span>
                        <span id="snack-text">100%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 md:h-4 shadow-inner border border-gray-300">
                        <div id="snack-fill" class="bg-brand-green h-full rounded-full transition-all" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </header>

        <div class="scrolling-environment" id="environment">
            <!-- The Road -->
            <div class="road">
                <div class="lane-lines" id="lane-lines"></div>
                
                <!-- Traffic obstacles injected via JS will go here -->
                <div id="traffic-container"></div>
                
                <!-- Player Car -->
                <!-- left position will be calculated via JS (0%, 33.3%, 66.6%) -->
                <div class="car-entity" id="player-car" style="bottom: 5%; left: 33.33%;">🚙</div>
            </div>

            <!-- Overlays -->
            <div class="absolute top-4 right-4 z-10 flex flex-col items-center gap-2">
                <!-- Speed Limit Sign -->
                <div class="speed-sign">
                    <div class="text-[10px] uppercase tracking-tighter leading-none">Speed<br>Limit</div>
                    <div id="speed-limit-text" class="text-3xl leading-none mt-1">55</div>
                </div>
                <!-- Warning Indicator -->
                <div id="police-warning" class="hidden text-red-600 animate-bounce">
                    <i class="fa-solid fa-triangle-exclamation fa-2x drop-shadow-md"></i>
                </div>
            </div>
        </div>

        <!-- ACTION PANEL / CONTROLS -->
        <div class="bg-slate-800 p-4 pb-8 shadow-[0_-10px_20px_rgba(0,0,0,0.3)] z-20 rounded-t-3xl border-t-4 border-slate-600 flex items-center justify-between gap-2">
            
            <!-- Steering Controls -->
            <div class="flex gap-2">
                <button id="btn-left" class="control-btn bg-blue-500 hover:bg-blue-400 active:bg-blue-600 text-white w-16 h-16 md:w-20 md:h-20 rounded-2xl shadow-[0_6px_0_#1e3a8a] active:shadow-[0_2px_0_#1e3a8a] active:translate-y-1 flex items-center justify-center text-3xl transition-all">
                    <i class="fa-solid fa-caret-left"></i>
                </button>
                <button id="btn-right" class="control-btn bg-blue-500 hover:bg-blue-400 active:bg-blue-600 text-white w-16 h-16 md:w-20 md:h-20 rounded-2xl shadow-[0_6px_0_#1e3a8a] active:shadow-[0_2px_0_#1e3a8a] active:translate-y-1 flex items-center justify-center text-3xl transition-all">
                    <i class="fa-solid fa-caret-right"></i>
                </button>
            </div>

            <!-- Speedometer -->
            <div class="flex-1 flex flex-col items-center justify-center text-white font-display border-4 border-slate-600 bg-slate-900 rounded-full h-20 w-20 md:h-24 md:w-24 p-2 shadow-inner">
                <span id="speedometer" class="text-3xl md:text-4xl text-cyan-400 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">0</span>
                <span class="text-[10px] text-gray-400 uppercase tracking-widest">MPH</span>
            </div>

            <!-- Gas Pedal -->
            <button id="btn-gas" class="control-btn gas-pedal text-white font-display text-xl md:text-2xl h-24 w-20 md:h-28 md:w-24 rounded-xl flex flex-col items-center justify-center select-none">
                <i class="fa-solid fa-forward-fast mb-1"></i>
                GAS
            </button>
            
        </div>

        <div id="event-modal" class="modal-overlay">
            <div class="bg-white p-6 rounded-3xl w-11/12 max-w-sm text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
                <div id="modal-icon" class="text-6xl mb-4">🚨</div>
                <h2 id="modal-title" class="font-display text-2xl text-gray-800 mb-2">Pulled Over!</h2>
                <p id="modal-desc" class="text-gray-600 mb-6 font-bold">You were going way too fast. Pay the ticket.</p>
                
                <button id="modal-btn" class="w-full bg-brand-yellow hover:bg-yellow-400 text-gray-900 font-display text-lg py-3 rounded-xl shadow-[0_4px_0_#b49000] active:translate-y-1 active:shadow-none transition-all">
                    Pay 25 Coins
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- Game State Variables ---
        let state = {
            gas: 100,
            snacks: 100,
            coins: 150,
            speed: 0,
            maxSpeed: 85,
            lane: 1, // 0 = Left, 1 = Center, 2 = Right
            speedLimit: 55,
            isAccelerating: false,
            speedingTimer: 0, // Accumulates when driving over the limit
            isGamePaused: false
        };

        // DOM Elements
        const elPlayer = document.getElementById('player-car');
        const elLines = document.getElementById('lane-lines');
        const elSpeedo = document.getElementById('speedometer');
        const elTrafficContainer = document.getElementById('traffic-container');
        const elLimitText = document.getElementById('speed-limit-text');
        const elPoliceWarning = document.getElementById('police-warning');
        const elScreen = document.getElementById('game-screen');
        const btnGas = document.getElementById('btn-gas');
        
        let backgroundPositionY = 0;
        let traffic = []; // Array to hold obstacle data
        let animationFrameId;
        let lastTime = 0;

        // --- Controller Setup ---
        function setLane(newLane) {
            if (state.isGamePaused) return;
            state.lane = Math.max(0, Math.min(2, newLane));
            // Update visual position (0% , 33.33%, 66.66%)
            elPlayer.style.left = (state.lane * 33.33) + '%';
        }

        document.getElementById('btn-left').addEventListener('click', () => setLane(state.lane - 1));
        document.getElementById('btn-right').addEventListener('click', () => setLane(state.lane + 1));

        // Touch & Mouse handlers for Gas Pedal
        function engageGas(e) { e.preventDefault(); if(!state.isGamePaused) { state.isAccelerating = true; btnGas.classList.add('active-press'); } }
        function releaseGas(e) { e.preventDefault(); state.isAccelerating = false; btnGas.classList.remove('active-press'); }
        
        btnGas.addEventListener('mousedown', engageGas);
        btnGas.addEventListener('touchstart', engageGas);
        window.addEventListener('mouseup', releaseGas);
        window.addEventListener('touchend', releaseGas);

        const obstacleEmojis = ['🚜', '🚐', '🚛', '🚗'];
        
        function spawnTraffic() {
            // Only spawn if moving reasonably fast and randomly
            if (state.speed > 20 && Math.random() < 0.02 && traffic.length < 3) {
                let spawnLane = Math.floor(Math.random() * 3);
                
                // Prevent spawning on top of existing traffic
                if (traffic.some(t => t.lane === spawnLane && t.y < 30)) return;

                let el = document.createElement('div');
                el.className = 'obstacle-car';
                el.innerHTML = obstacleEmojis[Math.floor(Math.random() * obstacleEmojis.length)];
                el.style.left = (spawnLane * 33.33) + '%';
                el.style.top = '-15%'; // Start above screen
                
                elTrafficContainer.appendChild(el);
                
                traffic.push({
                    el: el,
                    lane: spawnLane,
                    y: -15, // y represents percentage from top
                    speed: 20 + Math.random() * 20 // Obstacle moves forward slowly
                });
            }
        }

        function updateTraffic(deltaTime) {
            for (let i = traffic.length - 1; i >= 0; i--) {
                let t = traffic[i];
                
                // Relative speed: Player speed minus obstacle speed. 
                // If player is faster, obstacle comes closer (y increases).
                let relativeSpeed = state.speed - t.speed;
                
                // Update position based on relative speed
                t.y += (relativeSpeed * deltaTime * 0.05);
                t.el.style.top = t.y + '%';

                // Collision Detection
                // Player is firmly at bottom 5% (which is roughly y: 80-95% in top-down terms)
                if (t.lane === state.lane && t.y > 75 && t.y < 95) {
                    triggerCrash();
                }

                // Remove if it passes off screen (behind player or far ahead)
                if (t.y > 110 || t.y < -30) {
                    t.el.remove();
                    traffic.splice(i, 1);
                }
            }
        }

        const modal = document.getElementById('event-modal');
        const modalContent = document.getElementById('modal-content');
        
        function showModal(icon, title, desc, btnText, callback) {
            state.isGamePaused = true;
            state.speed = 0; // Stop car instantly
            state.isAccelerating = false;
            btnGas.classList.remove('active-press');

            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            
            let btn = document.getElementById('modal-btn');
            btn.innerText = btnText;
            btn.onclick = () => {
                modal.classList.remove('active');
                modalContent.style.transform = 'scale(0.95)';
                callback();
                setTimeout(() => { state.isGamePaused = false; lastTime = performance.now(); requestAnimationFrame(gameLoop); }, 300);
            };

            modal.classList.add('active');
            modalContent.style.transform = 'scale(1)';
        }

        function triggerCrash() {
            state.snacks = Math.max(0, state.snacks - 15);
            updateUI();
            showModal('💥', 'CRASH!', 'You hit a slow-moving vehicle! The kids are stressed (Lost 15% Snacks).', 'Resume Trip', () => {
                // Clear all traffic to prevent spawn trapping
                traffic.forEach(t => t.el.remove());
                traffic = [];
            });
        }

        function triggerPulledOver() {
            state.coins = Math.max(0, state.coins - 25);
            elScreen.classList.remove('police-active');
            state.speedingTimer = 0;
            elPoliceWarning.classList.add('hidden');
            updateUI();
            
            showModal('🚨', 'Pulled Over!', 'You were caught speeding! Pay the fine.', 'Pay 25 Coins', () => {
                // Change speed limit so they don't instantly get pulled over again
                changeSpeedLimit(); 
            });
        }

        function changeSpeedLimit() {
            const limits = [35, 45, 55, 65, 75];
            state.speedLimit = limits[Math.floor(Math.random() * limits.length)];
            elLimitText.innerText = state.speedLimit;
        }

        // Change speed limit randomly every 15 seconds
        setInterval(() => { if(!state.isGamePaused) changeSpeedLimit(); }, 15000);

        function updateUI() {
            document.getElementById('gas-fill').style.width = state.gas + '%';
            document.getElementById('gas-text').innerText = Math.floor(state.gas) + '%';
            document.getElementById('snack-fill').style.width = state.snacks + '%';
            document.getElementById('snack-text').innerText = Math.floor(state.snacks) + '%';
            document.getElementById('coin-counter').innerText = state.coins;

            // Color warnings
            document.getElementById('gas-fill').className = `h-full rounded-full transition-all ${state.gas < 25 ? 'bg-red-700' : 'bg-brand-red'}`;
            document.getElementById('snack-fill').className = `h-full rounded-full transition-all ${state.snacks < 25 ? 'bg-green-700' : 'bg-brand-green'}`;
        }

        function gameLoop(timestamp) {
            if (state.isGamePaused) return;

            let deltaTime = (timestamp - lastTime) / 1000; // in seconds
            if (isNaN(deltaTime)) deltaTime = 0;
            lastTime = timestamp;

            // Acceleration & Braking physics
            if (state.isAccelerating && state.gas > 0) {
                state.speed = Math.min(state.speed + (30 * deltaTime), state.maxSpeed);
            } else {
                // Friction / Coasting
                state.speed = Math.max(state.speed - (20 * deltaTime), 0);
            }

            // Update UI Speedometer
            elSpeedo.innerText = Math.floor(state.speed);

            // Animate road lines based on speed
            backgroundPositionY += (state.speed * deltaTime * 5); 
            elLines.style.backgroundPosition = `33% ${backgroundPositionY}px, 66% ${backgroundPositionY}px`;

            // Traffic handling
            spawnTraffic();
            updateTraffic(deltaTime);

            // Speeding Mechanic (Risk/Reward)
            if (state.speed > state.speedLimit + 5) {
                state.speedingTimer += deltaTime;
                elPoliceWarning.classList.remove('hidden');
                
                // Visual feedback gets more intense
                if (state.speedingTimer > 1.5) elScreen.classList.add('police-active');
                
                if (state.speedingTimer > 3) {
                    triggerPulledOver();
                    return; // Pause loop
                }
            } else {
                state.speedingTimer = Math.max(0, state.speedingTimer - (deltaTime * 2)); // Recover quickly if slowed down
                if (state.speedingTimer < 1.5) elScreen.classList.remove('police-active');
                if (state.speedingTimer === 0) elPoliceWarning.classList.add('hidden');
            }

            // Resource Draining
            if (state.speed > 0) {
                // Faster you go, faster gas burns. Base rate + speed factor
                let gasBurn = 0.5 + (state.speed / 100);
                state.gas = Math.max(0, state.gas - (gasBurn * deltaTime));
                
                // Snacks drain constantly over time, speed doesn't matter
                state.snacks = Math.max(0, state.snacks - (1.0 * deltaTime));
                
                updateUI();
            }

            // Game Over conditions
            if (state.gas <= 0) {
                showModal('⛽', 'Out of Gas!', 'You need to call a tow truck.', 'Restart Level', () => { location.reload(); });
                return;
            }
            if (state.snacks <= 0) {
                showModal('😭', 'Meltdown!', 'The kids ran out of snacks and completely lost it!', 'Restart Level', () => { location.reload(); });
                return;
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Initialize game
        updateUI();
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
